<script>
    $(document).ready(function() {
        const token = sessionStorage.getItem('accessToken') || localStorage.getItem('accessToken');
        if (!token) {
            window.location.href = '/client-login';
        }
    });

    $('#logoutBtn').click(function(e) {
        e.preventDefault();
        const token = sessionStorage.getItem('accessToken');
        $.ajax({
            url: 'http://localhost:8000/clearance/client/sign-out',
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token
            },
            success: function() {
                sessionStorage.removeItem('accessToken');
                window.location.href = '/client-login';
            },
            error: function() {
                // Even if logout fails, clear token and redirect
                sessionStorage.removeItem('accessToken');
                window.location.href = '/client-login';
            }
        });
    });
</script>

<script>
    // Add this script at the bottom of your HTML
    document.getElementById('shipmentForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const alertError = document.getElementById('errorAlert');
        const alertSuccess = document.getElementById('successAlert');
        const token = sessionStorage.getItem('accessToken');

        try {
            // Check if token exists
            if (!token) {
                throw new Error('Authentication required. Please log in again.');
            }

            const response = await fetch('/clearance/client/shipment', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                    // Don't add Content-Type header when using FormData
                },
                body: formData
            });

            // Handle non-JSON responses
            const contentType = response.headers.get('content-type');
            let data;
            
            if (contentType && contentType.includes('application/json')) {
                data = await response.json();
            } else {
                data = { message: await response.text() };
            }

            if (!response.ok) {
                throw new Error(data.message || 'Submission failed');
            }

            alertError.classList.add('d-none');
            alertSuccess.classList.remove('d-none');
            alertSuccess.textContent = data.message || 'Shipment added successfully';
            e.target.reset();

        } catch (error) {
            console.error('Shipment submission error:', error);
            alertSuccess.classList.add('d-none');
            alertError.classList.remove('d-none');
            alertError.textContent = error.message;
            
            // If error is due to authentication, redirect to login
            if (error.message.includes('Authentication') || 
                error.message.includes('token') || 
                error.message.includes('authorized')) {
                setTimeout(() => {
                    window.location.href = '/client-login';
                }, 2000); // Redirect after 2 seconds so user can see the error
            }
        }
    });
</script>
