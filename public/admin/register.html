<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />

    <title>Admin Register</title>

    <meta name="description" content="" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
            href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
            rel="stylesheet"
    />

    <!-- Icons. Uncomment required icon fonts -->
    <link rel="stylesheet" href="../assets/vendor/fonts/boxicons.css" />

    <!-- Core CSS -->
    <link rel="stylesheet" href="../assets/vendor/css/core.css" class="template-customizer-core-css" />
    <link rel="stylesheet" href="../assets/vendor/css/theme-default.css" class="template-customizer-theme-css" />
    <link rel="stylesheet" href="../assets/css/demo.css" />

    <!-- Vendors CSS -->
    <link rel="stylesheet" href="../assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css" />

    <!-- Page CSS -->
    <!-- Page -->
    <link rel="stylesheet" href="../assets/vendor/css/pages/page-auth.css" />
    <!-- Helpers -->
    <script src="../assets/vendor/js/helpers.js"></script>
    <link rel="stylesheet" href="../assets/css/sweetalert2.min.css">

    <!--! Template customizer & Theme config files MUST be included after core stylesheets and helpers.js in the <head> section -->
    <!--? Config:  Mandatory theme config file contain global vars & default theme options, Set your preferred theme option in this file.  -->
    <script src="../assets/js/config.js"></script>
</head>

<body>
<!-- Content -->

<div class="container-xxl">
    <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner">
            <!-- Register Card -->
            <div class="card">
                <div class="card-body">
                    <!-- Logo -->
                    <div class="app-brand justify-content-center">
                        <a href="/public" class="app-brand-link gap-2">
                            <span class="app-brand-text demo text-body fw-bolder">MRA Clearance System</span>
                        </a>
                    </div>
                    <!-- /Logo -->
                    <h4 class="mb-2">Welcome to MRA Clearance System</h4>
                    <p class="mb-4">Please sign-in to your account and start working</p>

                    <form id="formAuthentication" class="mb-3" action="../index.html" method="POST">
                        <div class="mb-3">
                            <label for="firstname" class="form-label">Firstname</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="firstname"
                                    name="firstname"
                                    placeholder="Enter your firstname"
                                    autofocus
                            />
                        </div>
                        <div class="mb-3">
                            <label for="lastname" class="form-label">Lastname</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    id="lastname"
                                    name="lastname"
                                    placeholder="Enter your lastname"
                                    autofocus
                            />
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="text" class="form-control" id="email" name="email" placeholder="Enter your email" />
                        </div>
                        <div class="mb-3 form-password-toggle">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-group input-group-merge">
                                <input
                                        type="password"
                                        id="password"
                                        class="form-control"
                                        name="password"
                                        placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                                        aria-describedby="password"
                                />
                                <span class="input-group-text cursor-pointer"><i class="bx bx-hide"></i></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms-conditions" name="terms" />
                                <label class="form-check-label" for="terms-conditions">
                                    I agree to
                                    <a href="javascript:void(0);">privacy policy & terms</a>
                                </label>
                            </div>
                        </div>
                        <button class="btn btn-primary d-grid w-100">Sign up</button>
                    </form>

                    <p class="text-center">
                        <span>Already have an account?</span>
                        <a href="/admin-login">
                            <span>Sign in instead</span>
                        </a>
                    </p>
                </div>
            </div>
            <!-- Register Card -->
        </div>
    </div>
</div>

<script src="../assets/vendor/libs/jquery/jquery.js"></script>
<script src="../assets/vendor/libs/popper/popper.js"></script>
<script src="../assets/vendor/js/bootstrap.js"></script>
<script src="../assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js"></script>
<script src="../assets/js/sweetalert.min.js"></script>

<script src="../assets/vendor/js/menu.js"></script>
<script src="../assets/js/main.js"></script>
<script async defer src="https://buttons.github.io/buttons.js"></script>

<script>
    $(document).ready(function() {
        $('#formAuthentication').submit(function(e) {
            e.preventDefault();

            swal({
                title: "Enter your Admin ID",
                text: "ID must start with '000' and be 8 digits long.",
                content: {
                    element: "input",
                    attributes: {
                        placeholder: "e.g., 00012345",
                        type: "text",
                    },
                },
                buttons: true,
                closeOnClickOutside: false,
                closeOnEsc: false
            })
                .then(function(adminId) {
                    if (!adminId) {
                        swal("Error", "Admin ID is required!", "error");
                        return;
                    }
                    if (!/^000\d{5}$/.test(adminId)) {
                        swal("Error", "Admin ID must start with '000' and be 8 digits long.", "error");
                        return;
                    }

                    var data = {
                        firstname: $('#firstname').val(),
                        lastname: $('#lastname').val(),
                        email: $('#email').val(),
                        password: $('#password').val(),
                        adminId: adminId
                    };

                    if (!data.firstname || !data.lastname || !data.email || !data.password) {
                        swal("Error", "Please fill in all fields.", "error");
                        return;
                    }

                    $.ajax({
                        url: 'http://localhost:8000/clearance/admin/sign-up',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(data),
                        success: function(response) {
                            if (response.success && response.data && response.data.token) {
                                // Save token to sessionStorage
                                sessionStorage.setItem('accessToken', response.data.token); // [2][4][5]
                                swal("Success", response.message, "success")
                                    .then(function() {
                                        // Redirect to dashboard
                                        window.location = "/admin-dashboard"; // [3]
                                    });
                            } else {
                                swal("Error", response.message || "Registration failed.", "error");
                            }
                        },
                        error: function(xhr) {
                            var message = "Registration failed.";
                            if (xhr.responseJSON && xhr.responseJSON.message) {
                                message = xhr.responseJSON.message;
                            }
                            swal("Error", message, "error");
                        }
                    });
                });
        });
    });
</script>
</body>
</html>
