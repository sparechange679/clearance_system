<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Management System - Login/Register</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 1rem auto;
            padding: 1.25rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);  /* Adjusted shadow for white background */
            border-radius: 8px;
            background: #2c5530;  /* Changed to dark green */
            border: 2px solid #1e3b21;  /* Darker green border */
            color: white;  /* White text for better contrast */
        }
        .role-specific-fields {
            display: none;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 1rem;
            border-bottom: 2px solid #1e3b21;  /* Added underline */
            padding-bottom: 1rem;  /* Added padding to space out the underline */
        }
        body {
            background-color: white !important;  /* Changed to white background */
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        /* New styles */
        .btn-primary {
            background-color: #2c5530 !important;
            border-color: #2c5530 !important;
        }
        
        .btn-primary:hover {
            background-color: #1e3b21 !important;
            border-color: #1e3b21 !important;
        }
        
        .nav-pills .nav-link {
            color: white;
        }
        
        .nav-pills .nav-link.active {
            background-color: #1e3b21 !important;  /* Darker green for active tab */
            color: white;
        }
        
        .nav-pills .nav-link:not(.active):hover {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.9);
            border-color: #1e3b21;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: white;
            border-color: #1e3b21;
            box-shadow: 0 0 0 0.25rem rgba(30, 59, 33, 0.25);
        }
        
        svg rect:first-of-type {
            fill: #2c5530;
        }
        
        svg path {
            fill: #ffd700;  /* Yellow */
        }
        
        .mb-3 {
            margin-bottom: 0.75rem !important;
        }
        
        .mb-4 {
            margin-bottom: 1rem !important;
        }
        
        .nav-pills {
            margin-bottom: 0.75rem !important;
        }
        
        h2 {
            font-size: 1.5rem;
            margin-top: 0.5rem !important;
            color: white;
        }
        
        svg {
            width: 80px;
            height: 80px;
        }
        
        /* Update form labels and text color */
        .form-label {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="logo-container">
                <img src="https://www.mra.mw/assets/fe/images/logo.png" 
                     alt="Malawi Revenue Authority" 
                     style="max-width: 200px; height: auto;">
                <h2 class="mt-3">Clearance Management System</h2>
            </div>

            <ul class="nav nav-pills mb-4" id="authTab">
                <li class="nav-item flex-fill">
                    <button class="nav-link active w-100" data-bs-toggle="pill" data-bs-target="#login">Login</button>
                </li>
                <li class="nav-item flex-fill">
                    <button class="nav-link w-100" data-bs-toggle="pill" data-bs-target="#register">Register</button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Login Form -->
                <div class="tab-pane fade show active" id="login">
                    <form id="loginForm" action="login.php" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="tab-pane fade" id="register">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">User Type</label>
                            <select class="form-select" id="registerUserType" required>
                                <option value="">Select User Type</option>
                                <option value="client">Client</option>
                                <option value="agent">Agent</option>
                                <option value="whkeeper">WH Keeper</option>
                                <option value="mraoffice">MRA Office</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" required>
                        </div>

                        <!-- Client Fields -->
                        <div id="clientFields" class="role-specific-fields">
                            <div class="mb-3">
                                <label class="form-label">Company Name</label>
                                <input type="text" class="form-control" required>
                            </div>
                        </div>

                        <!-- Agent Fields -->
                        <div id="agentFields" class="role-specific-fields">
                            <div class="mb-3">
                                <label class="form-label">License Number</label>
                                <input type="text" class="form-control" required>
                            </div>
                        </div>

                        <!-- WH Keeper Fields -->
                        <div id="whkeeperFields" class="role-specific-fields">
                            <div class="mb-3">
                                <label class="form-label">Warehouse ID</label>
                                <input type="text" class="form-control" required>
                            </div>
                        </div>

                        <!-- MRA Office Fields -->
                        <div id="mraofficeFields" class="role-specific-fields">
                            <div class="mb-3">
                                <label class="form-label">MRA Officer ID</label>
                                <input type="text" class="form-control" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
        // Show/hide role-specific fields based on user type selection
        document.getElementById('registerUserType').addEventListener('change', function() {
            // Hide all role-specific fields
            document.querySelectorAll('.role-specific-fields').forEach(el => el.style.display = 'none');
            
            // Show selected role fields
            const selectedRole = this.value;
            if (selectedRole) {
                document.getElementById(selectedRole + 'Fields').style.display = 'block';
            }
        });

        // Form submission handling
        // document.getElementById('loginForm').addEventListener('submit', function(e) {
        //     e.preventDefault();
        //     // Add your login logic here
        //     console.log('Login form submitted');
        // });

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Add your registration logic here
            console.log('Register form submitted');
        });
    </script>
</body>
</html>
