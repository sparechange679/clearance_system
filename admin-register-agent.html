    <form id="register-agent-form" method="post" action="register-agent.php" style="max-width: 400px; margin: 2rem auto; padding: 2rem; border: 1px solid #ddd; border-radius: 8px; background: #fafbfc;">
        <h2 style="text-align:center; margin-bottom: 1.5rem;">Register New Agent</h2>
        <div style="margin-bottom: 1rem;">
            <label for="username" style="display:block; margin-bottom:0.5rem;">Username:</label>
            <input type="text" id="username" name="username" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label for="email" style="display:block; margin-bottom:0.5rem;">Email:</label>
            <input type="email" id="email" name="email" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label for="password" style="display:block; margin-bottom:0.5rem;">Password:</label>
            <input type="password" id="password" name="password" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label for="licensed_number" style="display:block; margin-bottom:0.5rem;">Licensed Number:</label>
            <input type="text" id="licensed_number" name="licensed_number" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div style="margin-bottom: 1.5rem;">
            <label for="tpin" style="display:block; margin-bottom:0.5rem;">TPIN:</label>
            <input type="text" id="tpin" name="tpin" required maxlength="6" style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
        </div>
        <button type="submit" style="width:100%; padding:0.7rem; background:#007bff; color:#fff; border:none; border-radius:4px; font-size:1rem;">Register Agent</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let currentStep = 1;
            const totalSteps = 3;
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const submitBtn = document.getElementById('submitBtn');
            const progressBar = document.querySelector('.progress-bar');
            const stepIndicators = document.querySelectorAll('.step');

            function updateStep(step) {
                // Hide all steps
                document.querySelectorAll('.step-content').forEach(s => {
                    s.classList.remove('active');
                    s.classList.add('d-none');
                });
                
                // Show current step with animation
                const currentStepElement = document.getElementById(`step${step}`);
                currentStepElement.classList.remove('d-none');
                currentStepElement.classList.add('active');
                
                // Update progress bar
                const progress = ((step - 1) / (totalSteps - 1)) * 100;
                progressBar.style.width = `${progress}%`;
                
                // Update step indicators
                stepIndicators.forEach((indicator, index) => {
                    if (index + 1 <= step) {
                        indicator.classList.add('completed');
                    } else {
                        indicator.classList.remove('completed');
                    }
                    if (index + 1 === step) {
                        indicator.classList.add('active');
                    } else {
                        indicator.classList.remove('active');
                    }
                });

                // Update buttons
                prevBtn.style.display = step === 1 ? 'none' : 'block';
                nextBtn.style.display = step === totalSteps ? 'none' : 'block';
                submitBtn.style.display = step === totalSteps ? 'block' : 'none';
            }

            nextBtn.addEventListener('click', () => {
                if (currentStep < totalSteps) {
                    currentStep++;
                    updateStep(currentStep);
                }
            });

            prevBtn.addEventListener('click', () => {
                if (currentStep > 1) {
                    currentStep--;
                    updateStep(currentStep);
                }
            });

            // Get the form and modal elements
            const form = document.querySelector('form');
            const modal = new bootstrap.Modal(document.getElementById('confirmRegistrationModal'));
            
            // Handle form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Populate summary in modal
                document.getElementById('summaryName').textContent = 
                    `${document.getElementById('firstName').value} ${document.getElementById('lastName').value}`;
                document.getElementById('summaryEmail').textContent = 
                    document.getElementById('email').value;
                document.getElementById('summaryPhone').textContent = 
                    document.getElementById('phone').value;
                document.getElementById('summaryNationalId').textContent = 
                    document.getElementById('nationalId').value;
                
                // Show modal
                modal.show();
            });
            
            // Handle confirmation
            document.getElementById('confirmRegistrationBtn').addEventListener('click', function() {
                // Here you would typically submit the form data to your backend
                
                // Show success message
                modal.hide();
                
                // You can add a success toast/alert here
                alert('Agent registered successfully!');
                
                // Optionally redirect to another page
                // window.location.href = 'admin-dashboard.html';
            });
        });
    </script>
